<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DATA_PAGE_TITLE | Akademik MVC</title>
  <link href="assets/bootstrap.min.css" rel="stylesheet">
  <link href="assets/style.css" rel="stylesheet">
</head>

<body>
  DATA_NAVBAR

  <main class="container-fluid py-4 px-lg-4">
    DATA_FLASH

    <div class="row g-4">
      <div class="col-12 col-xl-4">
        <div class="card">
          <div class="card-header bg-white fs-5">DATA_FORM_TITLE</div>
          <div class="card-body">
            <form action="course.php" method="POST">
              DATA_FORM_ID

              <div class="mb-3">
                <label for="code" class="form-label">Kode Mata Kuliah (mis. IF305)</label>
                <input type="text" class="form-control text-uppercase" id="code" name="code" value="DATA_VAL_CODE"
                  maxlength="10" pattern="[A-Za-z]{2,4}[0-9]{3}" required>
              </div>

              <div class="mb-3">
                <label for="name" class="form-label">Nama Mata Kuliah</label>
                <input type="text" class="form-control" id="name" name="name" value="DATA_VAL_NAME" maxlength="150" required>
              </div>

              <div class="row">
                <div class="col-6 mb-3">
                  <label for="credits" class="form-label">SKS (1-6)</label>
                  <input type="number" class="form-control" id="credits" name="credits" value="DATA_VAL_CREDITS"
                    min="1" max="6" required>
                </div>
                <div class="col-6 mb-3">
                  <label for="semester" class="form-label">Semester (1-8)</label>
                  <input type="number" class="form-control" id="semester" name="semester" value="DATA_VAL_SEMESTER"
                    min="1" max="8" required>
                </div>
              </div>

              <div class="mb-4">
                <label for="lecturer_id" class="form-label">Dosen Pengampu</label>
                <select class="form-select" id="lecturer_id" name="lecturer_id" required>
                  DATA_OPT_LECTURER
                </select>
              </div>

              <div class="d-flex gap-2">
                <button type="submit" name="DATA_ACTION_NAME" class="btn DATA_BUTTON_CLASS">DATA_BUTTON_LABEL</button>
                DATA_CANCEL
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="col-12 col-xl-8">
        <div class="card">
          <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <span class="fs-5">Daftar Mata Kuliah</span>
            <span class="badge bg-primary">Total: DATA_TOTAL</span>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th class="text-center">No</th>
                    <th>Kode</th>
                    <th>Mata Kuliah</th>
                    <th class="text-center">SKS</th>
                    <th class="text-center">Smt</th>
                    <th>Dosen Pengampu</th>
                    <th>Program Studi</th>
                    <th>Aksi</th>
                  </tr>
                </thead>
                <tbody>
                  DATA_TABEL
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center text-muted py-3">
    Tugas Praktikum DPBO - Arsitektur MVC (PHP Native + MySQL)
  </footer>

  <script src="assets/bootstrap.bundle.min.js"></script>
</body>

</html>
