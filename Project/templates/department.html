<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DATA_PAGE_TITLE | Akademik MVC</title>
  <link href="assets/bootstrap.min.css" rel="stylesheet">
  <link href="assets/style.css" rel="stylesheet">
</head>

<body>
  DATA_NAVBAR

  <main class="container-fluid py-4 px-lg-4">
    DATA_FLASH

    <div class="row g-4">
      <div class="col-12 col-xl-4">
        <div class="card">
          <div class="card-header bg-white fs-5">DATA_FORM_TITLE</div>
          <div class="card-body">
            <form action="department.php" method="POST">
              DATA_FORM_ID

              <div class="mb-3">
                <label for="code" class="form-label">Kode Prodi (huruf besar, mis. IF)</label>
                <input type="text" class="form-control text-uppercase" id="code" name="code" value="DATA_VAL_CODE"
                  maxlength="10" pattern="[A-Za-z]{2,5}" required>
              </div>

              <div class="mb-3">
                <label for="name" class="form-label">Nama Program Studi</label>
                <input type="text" class="form-control" id="name" name="name" value="DATA_VAL_NAME" maxlength="100" required>
              </div>

              <div class="mb-3">
                <label for="head_name" class="form-label">Ketua Program Studi</label>
                <input type="text" class="form-control" id="head_name" name="head_name" value="DATA_VAL_HEAD" maxlength="100" required>
              </div>

              <div class="mb-4">
                <label for="building" class="form-label">Gedung</label>
                <input type="text" class="form-control" id="building" name="building" value="DATA_VAL_BUILDING" maxlength="100" required>
              </div>

              <div class="d-flex gap-2">
                <button type="submit" name="DATA_ACTION_NAME" class="btn DATA_BUTTON_CLASS">DATA_BUTTON_LABEL</button>
                DATA_CANCEL
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="col-12 col-xl-8">
        <div class="card">
          <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <span class="fs-5">Daftar Program Studi</span>
            <span class="badge bg-primary">Total: DATA_TOTAL</span>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th class="text-center">No</th>
                    <th>Kode</th>
                    <th>Program Studi</th>
                    <th>Ketua Prodi</th>
                    <th>Gedung</th>
                    <th class="text-center">Jumlah Dosen</th>
                    <th>Aksi</th>
                  </tr>
                </thead>
                <tbody>
                  DATA_TABEL
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center text-muted py-3">
    Tugas Praktikum DPBO - Arsitektur MVC (PHP Native + MySQL)
  </footer>

  <script src="assets/bootstrap.bundle.min.js"></script>
</body>

</html>
